const HEARTS = ["💖","💕","💗","💓","💞","🌸","✨","💫","🌹","🎀","💝","🫀"];
const EMOJIS_BG = ["💖","💕","🌸","✨","💫","🎀","🌹","💗","⭐","🎁","🎈","💝","🦋","🌺"];
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));

// -- Floating Background Emojis --
function FloatingBgEmojis({ count = 15, emojis = EMOJIS_BG, opacity = 0.2 }) {
  const items = React.useMemo(() => Array.from({ length: count }, (_, i) => ({
    id: i,
    emoji: emojis[i % emojis.length],
    left: rand(2, 95),
    top: rand(2, 95),
    size: rand(16, 38),
    dur: rand(3, 7),
    delay: rand(0, 4),
    anim: i % 2 === 0 ? 'float' : 'float2',
  })), [count]);
  return (
    <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'hidden', zIndex: 0 }}>
      {items.map(it => (
        <span key={it.id} style={{
          position: 'absolute', left: `${it.left}%`, top: `${it.top}%`,
          fontSize: it.size, opacity,
          animation: `${it.anim} ${it.dur}s ease-in-out ${it.delay}s infinite`,
          userSelect: 'none',
          display: 'block',
          filter: 'blur(0.3px)',
        }}>{it.emoji}</span>
      ))}
    </div>
  );
}

// -- Confetti --
function Confetti({ active, count = 80 }) {
  const pieces = React.useMemo(() => Array.from({ length: count }, (_, i) => ({
    id: i,
    color: ['#ff4081','#ff80ab','#ffb3cc','#ff6b9d','#ffd700','#ff9d6b','#a78bfa','#34d399','#60a5fa','#f472b6'][i % 10],
    left: rand(0, 100),
    dur: rand(2, 5),
    delay: rand(0, 2),
    size: rand(8, 18),
    shape: i % 4,
  })), [count]);
  if (!active) return null;
  return (
    <>
      {pieces.map(p => (
        <div key={p.id} className="confetti-piece" style={{
          left: `${p.left}%`, top: '-20px',
          background: p.color,
          width: p.size, height: p.size * (p.shape === 3 ? 0.4 : 1),
          borderRadius: p.shape === 0 ? '50%' : p.shape === 1 ? '2px' : p.shape === 2 ? '0' : '4px',
          animationDuration: `${p.dur}s`,
          animationDelay: `${p.delay}s`,
        }} />
      ))}
    </>
  );
}

// -- Balloons --

          left: `${b.left}%`, fontSize: rand(32, 52),
          animationDuration: `${b.dur}s`,

        }}>{b.emoji}</div>
      ))}
    </>
  );
}

// -- Click Hearts --
function ClickHearts() {
  const [hearts, setHearts] = useState([]);
  useEffect(() => {
    const handle = (e) => {
      const x = e.clientX ?? (e.touches?.[0]?.clientX) ?? 100;
      const y = e.clientY ?? (e.touches?.[0]?.clientY) ?? 100;
      setHearts(prev => [...prev.slice(-14), {
        id: Date.now() + Math.random(), x, y,
        emoji: HEARTS[Math.floor(Math.random() * HEARTS.length)],
        size: rand(18, 30),
      }]);
    };
    window.addEventListener('click', handle);
    window.addEventListener('touchstart', handle, { passive: true });
    return () => { window.removeEventListener('click', handle); window.removeEventListener('touchstart', handle); };
  }, []);
  return (
    <>
      {hearts.map(h => (
        <div key={h.id} className="heart-click" style={{
          left: h.x - 12, top: h.y - 12, fontSize: h.size,
        }}>{h.emoji}</div>
      ))}
    </>
  );
}

  const [time, setTime] = useState('');
  useEffect(() => {
    const update = () => {
      const now = new Date();
      const [y,m,d] = CONFIG.birthday.split('-').map(Number);
      const target = new Date(y, m-1, d);
      const diff = target - now;
      if (diff <= 0) { setTime("🎉 It's her birthday!"); return; }
      const days = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const min = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      setTime(`🎂 ${days}d ${h}h ${min}m ${s}s`);
    };
    update();
    const id = setInterval(update, 1000);
    return () => clearInterval(id);
  }, []);
  return (
    <div style={{
      position: 'fixed', top: 12, right: 12, zIndex: 1000,
      background: 'rgba(255,255,255,0.88)', backdropFilter: 'blur(12px)',
      borderRadius: 50, padding: '7px 15px',
      border: '1.5px solid #ffb3cc', fontSize: 11.5, fontWeight: 800,
      color: '#e91e63', fontFamily: 'Nunito',
      boxShadow: '0 4px 15px rgba(255,107,157,0.2)',
    }}>{time}</div>
  );
}

// -- Music Player --
function MusicPlayer({ audioRef, playing, setPlaying, candleAudioRef, candlePlaying }) {
  const [vol, setVol] = useState(0.6);

  const toggle = () => {
    if (!audioRef.current) return;
    if (playing) { audioRef.current.pause(); }
    else { audioRef.current.play().catch(() => {}); }
    setPlaying(!playing);
  };

  const hasBg = !!CONFIG.musicUrl;
  const hasCandle = candlePlaying && !!CONFIG.candleSongUrl;
  if (!hasBg && !hasCandle) return null;

  // Show candle song label when it's playing, else bg song
  const songName = hasCandle
    ? (CONFIG.candleSongName || '🎂 Birthday Song')
    : (CONFIG.musicName || '🎶 Song');

  return (
    <div style={{
      position: 'fixed', bottom: 16, left: 16, zIndex: 1001,
      display: 'flex', alignItems: 'center', gap: 8,
      background: 'rgba(255,255,255,0.92)', backdropFilter: 'blur(16px)',
      borderRadius: 50, padding: '8px 16px',
      border: '1.5px solid #ffb3cc', boxShadow: '0 4px 20px rgba(255,107,157,0.3)',
      maxWidth: '70vw',
    }}>
      <button onClick={hasBg ? toggle : undefined} style={{
        background: 'none', border: 'none', cursor: hasBg ? 'pointer' : 'default', fontSize: 20,
        animation: (playing || hasCandle) ? 'pulse 1s ease-in-out infinite' : 'none',
        flexShrink: 0,
      }}>{(playing || hasCandle) ? '🎵' : '▶️'}</button>
      <span style={{
        fontSize: 11, fontWeight: 700, color: '#e91e63',
        fontFamily: 'Nunito', whiteSpace: 'nowrap', overflow: 'hidden',
        textOverflow: 'ellipsis', maxWidth: 110,
      }}>{songName}</span>
      {hasBg && (
        <input type="range" min="0" max="1" step="0.05" value={vol}
          onChange={e => { setVol(+e.target.value); if(audioRef.current) audioRef.current.volume = +e.target.value; }}
          style={{ width: 55, accentColor: '#ff4081', cursor: 'pointer', flexShrink: 0 }}
        />
      )}
    </div>
  );
}

  const [phase, setPhase] = useState('closed'); // closed | opening | open

  const openEnvelope = () => {
    setPhase('opening');
    setTimeout(() => setPhase('open'), 900);
  };

  useEffect(() => {
    if (phase === 'open') {
      timerRef.current = setInterval(() => {
        setCharIdx(i => {
          if (i >= letterText.length) { clearInterval(timerRef.current); return i; }
          return i + 3;

// PAGE 9: MEMORIES (Netflix-style cinematic)
// =====================================================
function MemoriesPage({ onBack, onVideoPlay, onVideoEnd }) {
  const [current, setCurrent] = useState(0);
  const [fade, setFade] = useState(true);
  const [isPlaying, setIsPlaying] = useState(true);
  const [videoEnded, setVideoEnded] = useState(false);
  const intervalRef = useRef(null);
  const videoRef = useRef(null);
  const currentMem = CONFIG.memories[current];
  const isVideo = currentMem.type === 'video' && currentMem.img;

  const goTo = useCallback((idx) => {
    setFade(false);
    setVideoEnded(false);
    if (videoRef.current) { videoRef.current.pause(); }
    setTimeout(() => {
      setCurrent(idx);
      setFade(true);
    }, 400);
  }, []);

  const goNext = useCallback(() => {
    goTo((current + 1) % CONFIG.memories.length);
  }, [current, goTo]);

  // Auto-advance: for images use 4s timer; for videos wait for onEnded
  useEffect(() => {
    clearInterval(intervalRef.current);
    if (!isPlaying) return;
    if (!isVideo) {
      // Image: advance after 4 seconds
      intervalRef.current = setInterval(() => {
        setFade(false);
        setVideoEnded(false);
        setTimeout(() => {
          setCurrent(c => (c + 1) % CONFIG.memories.length);
          setFade(true);
        }, 400);
      }, 4000);
    }
    // For video: handled by onEnded below
    return () => clearInterval(intervalRef.current);
  }, [isPlaying, isVideo, current]);

  // When a video ends, advance to next (only if isPlaying)
  const handleVideoEnded = useCallback(() => {
    if (!isPlaying) return;
    setVideoEnded(true);
    setTimeout(() => { goNext(); }, 600);
  }, [isPlaying, goNext]);

  // When switching to a new video, play it + pause bg music
  useEffect(() => {
    if (isVideo && videoRef.current && fade) {
      videoRef.current.currentTime = 0;
      videoRef.current.play().catch(() => {});
      if (onVideoPlay) onVideoPlay();
    } else if (!isVideo) {
      // Switched to an image — resume bg music
      if (onVideoEnd) onVideoEnd();
    }
  }, [current, isVideo, fade]);

  // Resume bg music when leaving memories page
  useEffect(() => {
    return () => { if (onVideoEnd) onVideoEnd(); };
  }, []);

  const m = CONFIG.memories[current];

  return (
    <div className="page" style={{ background:'#080003', padding:0, justifyContent:'flex-start' }}>
      {/* Cinematic header */}
      <div style={{
        width:'100%', padding:'20px 20px 12px',
        background:'linear-gradient(to bottom,rgba(0,0,0,0.9),transparent)',
        position:'relative', zIndex:2,
        display:'flex', alignItems:'center', justifyContent:'space-between',
      }}>
        <div>
          <h2 style={{ fontFamily:'Dancing Script', fontSize:28, color:'#ff6b9d',
            textShadow:'0 0 20px rgba(255,107,157,0.8)' }}>Our Memories 💕</h2>
          <p style={{ color:'rgba(255,179,204,0.7)', fontSize:12 }}>A story written together</p>
        </div>
        <div style={{ display:'flex', gap:8, alignItems:'center' }}>
          <button onClick={() => setIsPlaying(p => !p)} style={{
            background:'rgba(255,107,157,0.2)', border:'1px solid rgba(255,107,157,0.4)',
            borderRadius:50, padding:'6px 14px', color:'#ff80ab', fontSize:12, fontWeight:700, cursor:'pointer',
          }}>{isPlaying ? '⏸ Pause' : '▶ Play'}</button>
        </div>
      </div>

      {/* Main Memory display — dynamic aspect ratio container */}
      <div style={{ width:'100%', position:'relative', transition:'opacity 0.4s', opacity:fade?1:0 }}>
        {m.type === 'video' && m.img ? (
          <div style={{
            width:'100%',
            background:'#000',
            display:'flex', alignItems:'center', justifyContent:'center',
            minHeight: 220, maxHeight:'75vw',
            overflow:'hidden',
          }}>
            <video
              key={current}
              ref={videoRef}
              src={m.img}
              autoPlay
              muted={false}
              playsInline
              controls={false}
              onEnded={handleVideoEnded}
              style={{
                width:'100%',
                height:'auto',
                maxHeight:'75vw',
                display:'block',
                objectFit:'contain',
                background:'#000',
              }}
            />
          </div>
        ) : m.img ? (
          <div style={{
            width:'100%',
            background:'#000',
            display:'flex', alignItems:'center', justifyContent:'center',
            minHeight: 220,
          }}>
            <img src={m.img} alt="memory" style={{
              width:'100%', height:'auto', maxHeight:'80vw',
              objectFit:'contain', display:'block',
            }} />
          </div>
        ) : (
          <div style={{
            width:'100%', height:'60vw', maxHeight:400, display:'flex',
            alignItems:'center', justifyContent:'center', flexDirection:'column',
            background:'linear-gradient(135deg,#1a0010,#2d0018)',
          }}>
            <div style={{ display:'flex', alignItems:'center', gap:12, opacity:0.6 }}>
              <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                {[0,1,2,3].map(i=><div key={i} style={{width:18,height:14,background:'rgba(255,107,157,0.3)',borderRadius:4}}/>)}
              </div>
              <div style={{ textAlign:'center' }}>
                <div style={{ fontSize:60, animation:'float 3s ease-in-out infinite',
                  filter:'drop-shadow(0 0 20px rgba(255,107,157,0.6))' }}>📷</div>
                <p style={{ color:'rgba(255,179,204,0.6)', fontSize:13, marginTop:8 }}>
                  Add a photo or video URL in CONFIG
                </p>
              </div>
              <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                {[0,1,2,3].map(i=><div key={i} style={{width:18,height:14,background:'rgba(255,107,157,0.3)',borderRadius:4}}/>)}
              </div>
            </div>
          </div>
        )}

        {/* Overlay gradient — only on images, not videos */}
        {!(m.type === 'video' && m.img) && (
          <div style={{
            position:'absolute', inset:0,
            background:'linear-gradient(to bottom,transparent 40%,rgba(8,0,3,0.95))',
            pointerEvents:'none',
          }}/>
        )}

        {/* Counter badge */}
        <div style={{
          position:'absolute', top:14, right:14,
          background:'rgba(255,64,129,0.9)', borderRadius:50,
          padding:'5px 14px', fontSize:13, fontWeight:900, color:'white',
          backdropFilter:'blur(10px)',
        }}>{current + 1} / {CONFIG.memories.length}</div>

        {/* Caption */}
        <div style={{
          padding:'12px 22px 8px', textAlign:'center',
        }}>
          <p style={{
            fontFamily:'Dancing Script', fontSize:22, color:'#ff80ab',
            textShadow:'0 0 30px rgba(255,107,157,0.8), 0 2px 10px rgba(0,0,0,0.9)',
            fontWeight:700,
          }}>{m.caption}</p>
        </div>
      </div>

      {/* Film strip thumbnails */}
      <div style={{
        width:'100%', overflowX:'auto', padding:'10px 16px',
        display:'flex', gap:10, scrollbarWidth:'none',
      }}>
        {CONFIG.memories.map((mem, i) => (
          <button key={i} onClick={() => goTo(i)} style={{
            flexShrink:0, width:60, height:60, borderRadius:10, overflow:'hidden',
            border: i===current ? '2.5px solid #ff4081' : '2px solid rgba(255,107,157,0.3)',
            cursor:'pointer', padding:0, background:'#1a0010',
            boxShadow: i===current ? '0 0 15px rgba(255,64,129,0.7)' : 'none',
            transition:'all 0.3s',
            transform: i===current ? 'scale(1.1)' : 'scale(1)',
          }}>
            {mem.img ? (
              mem.type==='video'
                ? <video src={mem.img} muted style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                : <img src={mem.img} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
            ) : (
              <div style={{ width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center',
                background:'linear-gradient(135deg,#2d0018,#1a0010)', fontSize:22 }}>
                {i===current ? '💖' : '📷'}
              </div>
            )}
          </button>
        ))}
      </div>

      {/* Dot navigation */}
      <div style={{ display:'flex', gap:8, justifyContent:'center', marginBottom:10 }}>
        {CONFIG.memories.map((_, i) => (
          <button key={i} onClick={() => goTo(i)} style={{
            width: i===current ? 28 : 8, height:8, borderRadius:50,
            background: i===current ? '#ff4081' : 'rgba(255,107,157,0.35)',
            border:'none', cursor:'pointer', transition:'all 0.35s', padding:0,
          }} />
        ))}
      </div>

      {/* Nav buttons */}
      <div style={{ display:'flex', gap:12, padding:'0 20px 16px' }}>
        <button onClick={() => goTo((current - 1 + CONFIG.memories.length) % CONFIG.memories.length)}
          className="btn-secondary" style={{ flex:1, color:'#ff80ab', borderColor:'rgba(255,107,157,0.4)',
            background:'rgba(255,255,255,0.07)', backdropFilter:'blur(10px)' }}>
          ← Prev
        </button>
        <button onClick={() => goTo((current + 1) % CONFIG.memories.length)}
          className="btn-primary" style={{ flex:1 }}>
          Next →
        </button>
      </div>

      <button onClick={onBack} style={{
        margin:'0 20px 24px', background:'rgba(255,107,157,0.15)',
        border:'1px solid rgba(255,107,157,0.35)', borderRadius:50,
        color:'#ff80ab', padding:'13px', fontFamily:'Nunito', fontWeight:800,
        fontSize:15, cursor:'pointer', width:'calc(100% - 40px)',
      }}>
        ← Back to Choices
      </button>
    </div>
  );
}

        <div style={{ display:'flex', gap:12, flexWrap:'wrap' }}>
          <button onClick={onRestart} className="btn-secondary" style={{ flex:1,
            color:'#ff6b9d', borderColor:'rgba(255,107,157,0.5)',
            background:'rgba(255,255,255,0.08)' }}>
            🔄 Restart
          </button>
          <button onClick={tapLove} className="btn-primary" style={{ flex:1 }}>
            💖 Send Love!
          </button>
        </div>
      </div>
    </div>
  );
}

function AdminPanel({ onClose, onSave }) {
  const [pin, setPin] = useState('');
  const [authed, setAuthed] = useState(false);
  const [tab, setTab] = useState('personal');
  const [cfg, setCfg] = useState({ ...CONFIG });
  const [saved, setSaved] = useState(false);

  const tryPin = () => {
    if (pin === CONFIG.adminPin || pin === CONFIG.secretCode) { setAuthed(true); }
    else { setPin(''); alert('Wrong PIN!'); }
  };

  const save = () => {
    Object.assign(CONFIG, cfg);
    setSaved(true);
    setTimeout(() => setSaved(false), 2500);
    if (onSave) onSave();
  };

  const downloadUpdated = () => {
    const source = document.documentElement.outerHTML;
    const cfgJson = JSON.stringify(cfg, null, 2);
    const updated = source.replace(
      /let CONFIG = \{[\s\S]*?\n\};/m,
      'let CONFIG = ' + cfgJson + ';'
    );
    const blob = new Blob([updated], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'finalbday_updated.html';
    a.click();
    URL.revokeObjectURL(url);

function App() {
  const [page, setPage] = useState('lock');
  const [transKey, setTransKey] = useState(0);
  const [showAdmin, setShowAdmin] = useState(false);
  const [musicPlaying, setMusicPlaying] = useState(false);
  const [candlePlaying, setCandlePlaying] = useState(false);
  const audioRef = useRef(null);
  const candleAudioRef = useRef(null);
  const keyBuf = useRef('');
  const keyTimer = useRef(null);

  // Init background audio once
  useEffect(() => {
    if (!CONFIG.musicUrl) return;
    if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
    audioRef.current = new Audio(CONFIG.musicUrl);
    audioRef.current.loop = true;
    audioRef.current.volume = 0.6;
    return () => { audioRef.current?.pause(); };
  }, []);

  const startMusic = useCallback(() => {
    if (!CONFIG.musicUrl) return;
    if (!audioRef.current) {
      audioRef.current = new Audio(CONFIG.musicUrl);
      audioRef.current.loop = true;
      audioRef.current.volume = 0.6;
    }
    audioRef.current.play().catch(() => {});
    setMusicPlaying(true);
  }, []);

  // Candle song: play once when candles blown
  const startCandleSong = useCallback(() => {
    if (!CONFIG.candleSongUrl) return;
    if (candleAudioRef.current) { candleAudioRef.current.pause(); candleAudioRef.current = null; }
    candleAudioRef.current = new Audio(CONFIG.candleSongUrl);
    candleAudioRef.current.loop = false;
    candleAudioRef.current.volume = 0.85;
    candleAudioRef.current.play().catch(() => {});
    candleAudioRef.current.onended = () => setCandlePlaying(false);
    setCandlePlaying(true);
  }, []);

  const stopCandleSong = useCallback(() => {
    if (candleAudioRef.current) { candleAudioRef.current.pause(); candleAudioRef.current.currentTime = 0; }
    setCandlePlaying(false);
  }, []);

  // Pause/resume bg music when memory videos play
  const pauseBgMusic = useCallback(() => {
    if (audioRef.current && musicPlaying) audioRef.current.pause();
  }, [musicPlaying]);

  const resumeBgMusic = useCallback(() => {
    if (audioRef.current && musicPlaying) audioRef.current.play().catch(() => {});
  }, [musicPlaying]);

  // Secret keyboard shortcut: type secret code at any time (not in input)
  useEffect(() => {
    const handle = (e) => {
      if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
      keyBuf.current += e.key.toLowerCase();
      clearTimeout(keyTimer.current);
      keyTimer.current = setTimeout(() => { keyBuf.current = ''; }, 2000);
      if (keyBuf.current.endsWith(CONFIG.secretCode)) {
        keyBuf.current = '';
        setShowAdmin(true);
      }
    };
    window.addEventListener('keydown', handle);
    return () => window.removeEventListener('keydown', handle);
  }, []);

  const navigate = useCallback((to) => {
    // Stop candle song when leaving birthday page
    if (to !== 'birthday') stopCandleSong();
    setTransKey(k => k + 1);
    setPage(to);
    window.scrollTo({ top:0, behavior:'smooth' });
  }, [stopCandleSong]);

  const handleUnlock = useCallback(() => {
    startMusic();
    navigate('intro');
  }, [startMusic, navigate]);

  const pageMap = {
    lock: <LockScreen onUnlock={handleUnlock} onAdminOpen={() => setShowAdmin(true)} />,
    intro: <IntroPage onYes={() => navigate('birthday')} onNo={() => navigate('no')} />,
    no: <NoPage onBack={() => navigate('intro')} />,
    birthday: <BirthdayCandlePage onNext={() => navigate('letter')} onCandleBlown={startCandleSong} />,
    letter: <LetterPage onNext={() => navigate('choices')} />,
    choices: <ChoicesPage onChoice={(c) => {
      if (c === 'fav') navigate('fav');
      else if (c === 'coupons') navigate('coupons');
      else if (c === 'memories') navigate('memories');
      else navigate('final');
    }} />,
    fav: <YourFavPage onBack={() => navigate('choices')} />,
    coupons: <CouponsPage onBack={() => navigate('choices')} />,
    memories: <MemoriesPage onBack={() => navigate('choices')} onVideoPlay={pauseBgMusic} onVideoEnd={resumeBgMusic} />,
    final: <FinalPage onRestart={() => navigate('lock')} />,
  };

  return (
    <div>
      <div key={transKey} style={{ animation:'fadeIn 0.45s ease' }}>
        <CountdownBadge />
        <MusicPlayer audioRef={audioRef} playing={musicPlaying} setPlaying={setMusicPlaying} candleAudioRef={candleAudioRef} candlePlaying={candlePlaying} />
        <ClickHearts />
        {pageMap[page] || pageMap['lock']}
      </div>

      {/* 
        ADMIN TRIGGER HINT (only for you, reading the source):
        • Type "iloveyou" on any page (not in an input box) to open admin panel
        • OR type it as the password on the lock screen
        • Admin PIN is whatever CONFIG.adminPin is set to (default: "1234")
      */}

      {/* Invisible admin trigger dot - visually hidden */}
      <div
        onClick={() => setShowAdmin(true)}
        style={{
          position:'fixed', bottom:0, right:0, width:20, height:20,
          opacity:0, cursor:'default', zIndex:99998,
        }}
        title=""
      />

      {showAdmin && (
        <AdminPanel
          onClose={() => setShowAdmin(false)}
          onSave={() => {}}
        />
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
